[package]
name = "leashpay"
description = "LeashPay: an on-chain spending leash for AI agents on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hassaanraja282-lgtm/leashpay"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
